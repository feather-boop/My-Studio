<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#2a2991">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--on:#fff;--bg:#eef0f4;--panel:#fff;--ink:#1c2230;--mute:#6a7286;--line:#d9dde6;--acc:#4a48c9;--accsoft:#e6e6fb;--ok:#1f8a78;--warn:#b4442f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--on:#12151d;--bg:#12151d;--panel:#1b202b;--ink:#eceff6;--mute:#949cb1;--line:#2c3342;--acc:#9a98ff;--accsoft:#2a2b52;--ok:#4fc9b2;--warn:#ff8f78}}
:root[data-theme="dark"]{color-scheme:dark;--on:#12151d;--bg:#12151d;--panel:#1b202b;--ink:#eceff6;--mute:#949cb1;--line:#2c3342;--acc:#9a98ff;--accsoft:#2a2b52;--ok:#4fc9b2;--warn:#ff8f78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:380px 1fr;transition:grid-template-columns .3s ease;height:100vh;height:100dvh}
.list{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:20px 16px}
.detail{overflow-y:auto;padding:28px clamp(18px,4vw,48px)}
h1{font-size:28px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn{color:#12151d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#12151d}}
.btn.ghost{background:var(--accsoft);color:var(--acc)}
.btn.full{width:100%}
.card{display:block;width:100%;text-align:start;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.card.on{border-color:var(--acc);background:var(--accsoft)}
.card b{font-size:18px;font-weight:600}
.meta{color:var(--mute);font-size:14px;display:flex;justify-content:space-between;gap:8px;margin-top:2px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .3s}
.field{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.newbox{margin-top:12px;display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--accsoft)}
.title{width:100%;border:0;background:none;font-size:34px;font-weight:800;letter-spacing:-.02em;padding:4px 0}
.medium{width:100%;border:0;background:none;color:var(--mute);padding:2px 0 14px}
.stages{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--panel)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
:root[data-theme="dark"] .chip.on{color:#12151d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#12151d}}
h2{font-size:20px;font-weight:600;margin:28px 0 8px}
.pct{font-size:44px;font-weight:800;color:var(--ok);line-height:1}
.row{display:flex;align-items:center;gap:6px;min-height:52px;border-bottom:1px solid var(--line)}

.row input[type=checkbox]{width:26px;height:26px;accent-color:var(--ok)}
.row.done span{color:var(--mute);text-decoration:line-through}
.x{min-width:48px;min-height:48px;color:var(--mute);font-size:20px}
.add{display:flex;gap:8px;margin-top:10px}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry time{color:var(--mute);font-size:14px}
.entry p{margin:2px 0 0;white-space:pre-wrap}
.empty{color:var(--mute);padding:20px 0}
.danger{color:var(--warn);margin-top:36px;min-height:48px}
.back{display:none;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center}
@media (max-width:760px){.app{grid-template-columns:1fr}.detail{display:none}.app.open .list{display:none}.app.open .detail{display:block}.back{display:inline-block}}
.srch{margin-top:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.filters .chip{min-height:40px;padding:0 12px;font-size:14px}
.sel{min-height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);flex:1;min-width:120px}
.tag{display:inline-block;font-size:13px;padding:1px 9px;border-radius:10px;background:var(--accsoft);color:var(--acc);margin-right:6px}
.part{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px;margin-top:14px}
.part .stages{margin:10px 0 8px}
.pm{border:0;background:none;font-size:20px;font-weight:600;padding:2px 0;width:100%}
.lbl{color:var(--mute);font-size:14px;margin:14px 0 4px}
.sm{min-height:44px}
@media (max-width:760px){.filters .sel{min-width:100px}}
.bubs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bub{display:inline-flex;align-items:center;gap:2px;padding:0 4px 0 14px;min-height:36px;border-radius:18px;background:var(--accsoft);color:var(--acc);font-weight:600}
.bub button{min-width:36px;min-height:36px;color:var(--acc);font-size:18px}
.cb{display:inline-block;font-size:13px;padding:1px 10px;border-radius:12px;background:var(--accsoft);color:var(--acc);margin:4px 6px 0 0}
.stb{min-width:84px;min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.stb.doing{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
.stb.done{background:var(--ok);border-color:var(--ok);color:var(--on)}
.row .mt{flex:1;min-width:0}
.row.done .mt{color:var(--mute);text-decoration:line-through}
.row.wrap{flex-wrap:wrap;padding:6px 0}
.row .sel{flex:0 1 150px;min-width:110px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.who{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px}
.who ul{list-style:none;margin:8px 0 0;padding:0}
.who li{padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.who li em{font-style:normal;font-weight:600;color:var(--mute);margin-right:6px}
.who li.doing em{color:var(--acc)}
.who li small{color:var(--mute)}
.who li.none{color:var(--mute);border-top:0}
.hide{display:none}
.who li.next{display:flex;align-items:center;gap:6px;font-weight:600}
.who li.next em{color:var(--acc)}
.who li .tt{flex:1}
.x.sm2{min-width:36px;min-height:36px;font-size:18px}
.dates{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;align-items:center}
.dates label{display:flex;align-items:center;gap:8px;color:var(--mute)}
input[type=date]{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 10px}
.over{color:var(--warn)}.tag.over{background:none;font-weight:600}
.it{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;width:100%;text-align:start;min-height:52px;padding:10px 14px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.it small{color:var(--mute);margin-left:auto}
.notes{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.notes summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.ntext{white-space:pre-wrap;user-select:text;-webkit-user-select:text;margin:4px 0 10px;overflow-wrap:anywhere}
.ntext a{color:var(--acc)}
.stb.waiting{background:var(--accsoft);border-color:var(--acc);color:var(--acc)}
.list{width:380px;transition:transform .3s ease,visibility 0s}
.app.collapsed{grid-template-columns:0px 1fr}
.app.collapsed .list{transform:translateX(-100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s}
.app.collapsed .detail{padding-left:48px}
.detail{transition:padding .3s ease}
.tab{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:380px;z-index:20;width:26px;height:56px;border-radius:0 12px 12px 0;background:var(--panel);border:1px solid var(--line);border-left:0;color:var(--mute);font-size:22px;line-height:1;transition:left .3s ease}
.app.collapsed~.tab{left:0}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.hdr h1{margin:0}
.fil{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.fil summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
.fil .filters{margin:0 0 10px}
.card b{display:block}
.card.leaving{pointer-events:none}
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.head .title{flex:1 1 260px;min-width:0;width:auto}
.head .dates{flex:0 0 auto;margin:0;flex-direction:column;align-items:stretch;gap:6px}
.head .dates label{justify-content:space-between}
.rolerow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 6px}
.rolerow .sel{flex:0 0 auto;min-width:190px}
.rolerow .field{flex:1 1 220px;min-width:200px}
@media (max-width:760px){.tab{display:none}.list{width:auto}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="list" id="list"><div id="ctl"></div><div id="results"></div><div id="emsg"></div></aside>
  <main class="detail" id="detail"></main>
</div>
<button class="tab" id="menuTab" aria-label="Hide menu" aria-expanded="true">‹</button>
<script>
var STAGES=["Idea","Sketching","Making","Refining","Finished"];
var ROLES={solo:"Solo",collab:"Collaboration",help:"Support role"};
var KEY="studio-progress-v1";
var S={projects:[],sel:null,adding:false,confirm:false,confirmPart:null,q:"",role:"all",stage:"all",medium:"all",person:"all",draft:{},rt:0,filtersOpen:false,collapsed:false,shelf:"active",main:"project",editNotes:null,openNotes:{},tpl:{Song:["Write lyrics","Record demo","Record final takes","Mix","Master"],Video:["Storyboard","Shoot","Edit","Color grade","Export"],Artwork:["Sketch","Block in color","Refine details","Final touches"],Writing:["Outline","First draft","Revise","Proofread"]}};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function splitNames(s){var o=[];String(s||"").split(",").forEach(function(n){n=n.trim();if(n&&!o.some(function(x){return x.toLowerCase()===n.toLowerCase()}))o.push(n)});return o}
try{var raw=localStorage.getItem(KEY);if(raw){var pp=JSON.parse(raw);if(pp&&pp.projects)S.projects=pp.projects;if(pp&&pp.tpl)S.tpl=pp.tpl;S.sel=pp&&pp.sel||null}}catch(e){}
S.projects.forEach(function(p){
  if(!p.parts)p.parts=[{id:uid(),medium:p.medium||"",stage:p.stage||"Idea",milestones:p.milestones||[]}];
  if(!p.role)p.role="solo";if(!p.log)p.log=[];
  p.people=Array.isArray(p.people)?p.people:splitNames(p.people);
  p.tasks=p.tasks||[];
  if(p.role!=="solo"&&p.next){p.tasks.push({id:uid(),t:p.next,who:p.nextWho||"Me"});p.next=""}
  p.shelf=p.shelf||"active";p.due=p.due||"";p.ended=p.ended||0;
  p.created=p.created||(p.log.length?Math.min.apply(null,p.log.map(function(e){return e.d})):(p.updated||Date.now()));
  p.parts.forEach(function(x){x.milestones.forEach(function(m){if(!m.st)m.st=m.done?"done":"todo";if(m.who==null)m.who="";m.due=m.due||""});x.notes=x.notes||""});
  p.log.forEach(function(e){if(e.ms){var m=allMs(p).find(function(z){return z.id===e.ms});if(m)e.t=doneText(m)}});
});
function doneText(m){return "Milestone done by "+(m.who||"Me")+": "+m.t}
var SL={todo:"To do",doing:"Doing",waiting:"Waiting",done:"Done"};
function ymd(t){var d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fromYmd(v){return v?new Date(v+"T12:00:00").getTime():0}
function dayN(a,b){return Math.max(0,Math.round((fromYmd(ymd(b))-fromYmd(ymd(a)))/864e5))}
function dueDiff(v){return Math.round((fromYmd(v)-fromYmd(ymd(Date.now())))/864e5)}
function dueLabel(v){var d=dueDiff(v);return d<0?"Overdue by "+(-d)+(d===-1?" day":" days"):d===0?"Due today":d===1?"Due tomorrow":"Due "+fmt(fromYmd(v))}
function activeDays(p){var o={};p.log.forEach(function(e){o[ymd(e.d)]=1});return Object.keys(o).length}
function linkify(t){return esc(t).replace(/https?:\/\/[^\s<]+/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'})}
function isRtl(s){var m=String(s||"").match(/[A-Za-z\u00C0-\u024F\u0370-\u03FF\u0400-\u04FF\u0590-\u08FF]/);return !!m&&m[0]>="\u0590"&&m[0]<="\u08FF"}
function applyDir(root){root.querySelectorAll('input:not([type=date]):not([type=checkbox]):not([type=file]),textarea,.mt,.entry p,.ntext,.tt,.card b,.it span').forEach(function(el){el.setAttribute("dir","auto")})}
function datesHtml(p){
  return '<div class="dates" dir="ltr"><label>Started <input type="date" id="cr" value="'+ymd(p.created)+'"></label><label>Due <input type="date" id="due" value="'+esc(p.due)+'"></label></div>';
}
function daysLine(p){
  var n=dayN(p.created,p.ended||Date.now()),w=activeDays(p);
  var h='<div class="sub" style="margin:6px 0 14px">'+(p.ended?'Ran for ':'')+n+(n===1?' day':' days')+(p.ended?'':' in')+' · actively worked on '+w+(w===1?' day':' days');
  if(p.due&&p.shelf==="active")h+=' · <span class="'+(dueDiff(p.due)<0?'over':'')+'">'+dueLabel(p.due)+'</span>';
  return h+'</div>';
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({projects:S.projects,sel:S.sel,tpl:S.tpl}))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cur(){return S.projects.find(function(p){return p.id===S.sel})}
function team(p){return p.role==="solo"?[]:p.people}
function allMs(p){var a=[];p.parts.forEach(function(x){a=a.concat(x.milestones)});return a}
function pct(p){var m=allMs(p);return m.length?Math.round(m.filter(function(x){return x.st==="done"}).length/m.length*100):0}
function fmt(t){return new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function $(id){return document.getElementById(id)}
function mediums(){var o={};S.projects.forEach(function(p){p.parts.forEach(function(x){if(x.medium)o[x.medium]=1})});return Object.keys(o).sort()}
function everyone(){var o={};S.projects.forEach(function(p){team(p).forEach(function(n){o[n]=1})});return Object.keys(o).sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1})}
function opts(arr,val,all){return '<option value="all">'+all+'</option>'+arr.map(function(a){return '<option'+(a===val?' selected':'')+'>'+esc(a)+'</option>'}).join("")}
function roleHint(r){return r==="help"?"Whose project is it? Type a name, then press comma":"Add collaborators: type a name, then press comma"}
function whoSel(p,val,attr,none){
  var h='<select class="sel" '+attr+' aria-label="Assigned to"><option value="">'+none+'</option><option value="Me"'+(val==="Me"?' selected':'')+'>Me</option>';
  team(p).forEach(function(n){h+='<option'+(n===val?' selected':'')+'>'+esc(n)+'</option>'});
  return h+'</select>';
}

function renderControls(anim){
  if(S.stage!=="all"&&STAGES.indexOf(S.stage)<0)S.stage="all";
  if(S.medium!=="all"&&mediums().indexOf(S.medium)<0)S.medium="all";
  if(S.person!=="all"&&everyone().indexOf(S.person)<0)S.person="all";
  var h='<div class="hdr"><h1>My Studio</h1><button class="btn" id="addBtn">New project</button></div><p class="sub" id="count"></p><div class="filters" style="margin:0 0 12px">'+[["today","Today"],["upcoming","Upcoming"],["backup","Backup"]].map(function(s){return '<button class="chip'+(S.main===s[0]?' on':'')+'" data-main="'+s[0]+'" aria-pressed="'+(S.main===s[0])+'">'+s[1]+'</button>'}).join("")+'</div>';
  if(S.adding){
    h+='<div class="newbox"><input class="field" id="nt" placeholder="Project title" maxlength="80"><select class="sel" id="nr" aria-label="Project type">'+Object.keys(ROLES).map(function(k){return '<option value="'+k+'">'+ROLES[k]+'</option>'}).join("")+'</select><input class="field hide" id="np" placeholder="Names, separated by commas" maxlength="160"><input class="field" id="nm" placeholder="First medium (song, video, painting…)" maxlength="60"><button class="btn" id="nsave">Create project</button></div>';
  }
  h+='<div class="filters" style="margin-top:6px">'+[["active","Active"],["dead","Dead Zone"],["done","Proudly Done"]].map(function(s){return '<button class="chip'+(S.shelf===s[0]?' on':'')+'" data-shelf="'+s[0]+'" aria-pressed="'+(S.shelf===s[0])+'">'+s[1]+' ('+S.projects.filter(function(p){return p.shelf===s[0]}).length+')</button>'}).join("")+'</div>';
  h+='<input class="field srch" id="q" type="search" placeholder="Search titles, people, notes" value="'+esc(S.q)+'" aria-label="Search projects">';
  var nf=(S.role!=="all")+(S.stage!=="all")+(S.medium!=="all")+(S.person!=="all");
  h+='<details class="fil" id="fd"'+(S.filtersOpen?' open':'')+'><summary>Filters'+(nf?' <span class="tag">'+nf+' on</span>':'')+'</summary><div class="filters">';
  [["all","All"],["solo","Solo"],["collab","Collab"],["help","Support"]].forEach(function(r){h+='<button class="chip'+(S.role===r[0]?' on':'')+'" data-role="'+r[0]+'" aria-pressed="'+(S.role===r[0])+'">'+r[1]+'</button>'});
  h+='</div><div class="filters"><select class="sel" id="fs" aria-label="Filter by stage">'+opts(STAGES,S.stage,"Any stage")+'</select><select class="sel" id="fm" aria-label="Filter by medium">'+opts(mediums(),S.medium,"Any medium")+'</select><select class="sel" id="fp" aria-label="Filter by person">'+opts(everyone(),S.person,"Anyone")+'</select></div></details>';
  $("ctl").innerHTML=h;
  $("addBtn").onclick=function(){S.adding=!S.adding;renderControls();var n=$("nt");if(n)n.focus()};
  if(S.adding){
    $("nr").onchange=function(){var np=$("np");np.classList.toggle("hide",this.value==="solo");np.placeholder=this.value==="help"?"Whose project is it?":"Collaborators, separated by commas"};
    $("nsave").onclick=function(){
      var t=$("nt").value.trim();if(!t){$("nt").focus();return}
      var r=$("nr").value;
      var p={id:uid(),title:t,role:r,people:r==="solo"?[]:splitNames($("np").value),next:"",tasks:[],shelf:"active",created:Date.now(),due:"",parts:[{id:uid(),medium:$("nm").value.trim(),stage:"Idea",owner:"",milestones:[]}],log:[],updated:Date.now()};
      S.projects.push(p);S.sel=p.id;S.shelf="active";S.main="project";S.adding=false;S.confirm=false;save();render(true)};
  }
  $("q").oninput=function(){S.q=this.value;renderResults(false)};
  $("fd").ontoggle=function(){S.filtersOpen=this.open};
  [].forEach.call(document.querySelectorAll("[data-main]"),function(b){b.onclick=function(){S.main=S.main===b.dataset.main?"project":b.dataset.main;$("app").classList.add("open");render()}});
  [].forEach.call(document.querySelectorAll("[data-shelf]"),function(b){b.onclick=function(){S.shelf=b.dataset.shelf;renderControls(true)}});
  [].forEach.call(document.querySelectorAll("[data-role]"),function(b){b.onclick=function(){S.role=b.dataset.role;renderControls(true)}});
  $("fs").onchange=function(){S.stage=this.value;renderResults(true)};
  $("fm").onchange=function(){S.medium=this.value;renderResults(true)};
  $("fp").onchange=function(){S.person=this.value;renderResults(true)};
  renderResults(anim);
}
function matches(p){
  if(p.shelf!==S.shelf)return false;
  if(S.role!=="all"&&p.role!==S.role)return false;
  if(S.stage!=="all"&&!p.parts.some(function(x){return x.stage===S.stage}))return false;
  if(S.medium!=="all"&&!p.parts.some(function(x){return x.medium===S.medium}))return false;
  if(S.person!=="all"&&team(p).indexOf(S.person)<0)return false;
  var q=S.q.trim().toLowerCase();if(!q)return true;
  var hay=[p.title,team(p).join(" "),p.next,(p.tasks||[]).map(function(k){return k.t}).join(" "),ROLES[p.role]].concat(p.parts.map(function(x){return x.medium+" "+(x.notes||"")}),p.parts.reduce(function(a,x){return a.concat(x.milestones.map(function(m){return m.t}))},[]),p.log.map(function(e){return e.t})).join(" ").toLowerCase();
  return q.split(/\s+/).every(function(w){return hay.indexOf(w)>-1});
}
function cardInner(p){

  h+='<div class="meta"><span>'+p.parts.map(function(x){return esc(x.medium||"Untitled part")+": "+x.stage}).join(" · ")+'</span></div>';

function renderResults(anim){
  var list=S.projects.filter(matches).sort(function(a,b){return (b.updated-a.updated)||(b.created-a.created)});
  var tot=S.projects.filter(function(p){return p.shelf===S.shelf}).length;
  $("count").textContent=list.length===tot?tot+(tot===1?" project":" projects"):list.length+" of "+tot+" shown";
  $("emsg").innerHTML=!tot?'<p class="empty">'+{active:"Nothing here yet. Add your first project to start logging progress.",dead:"The Dead Zone is empty. Projects you started but never finished can rest here.",done:"Nothing in Proudly Done yet. Finished projects will be archived here."}[S.shelf]+'</p>':!list.length?'<p class="empty">No projects match. Clear the search or filters to see everything.</p>':'';
  var box=$("results"),tk=++S.rt,els={},ids={};
  [].forEach.call(box.children,function(e){els[e.dataset.id]=e});
  list.forEach(function(p){ids[p.id]=1});
  var dur=anim&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)&&box.animate!==undefined;
  var gone=Object.keys(els).filter(function(id){return !ids[id]});
  gone.forEach(function(id){var e=els[id];if(e.classList.contains("leaving"))return;e.classList.add("leaving");if(dur)e.animate([{opacity:1},{opacity:0}],{duration:180,fill:"forwards"})});
  setTimeout(function(){
    if(tk!==S.rt)return;
    var first={};
    [].forEach.call(box.children,function(e){first[e.dataset.id]=e.getBoundingClientRect().top});
    gone.forEach(function(id){els[id].remove();delete els[id]});
    list.forEach(function(p){
      var e=els[p.id];
      if(!e){e=document.createElement("button");e.dataset.id=p.id;e.dataset.fresh="1";els[p.id]=e}
      e.className="card"+(p.id===S.sel?" on":"");e.dataset.open=p.id;e.innerHTML=cardInner(p);applyDir(e);
      box.appendChild(e);
    });
    list.forEach(function(p){
      var e=els[p.id];
      if(e.dataset.fresh){delete e.dataset.fresh;if(dur)e.animate([{opacity:0},{opacity:1}],{duration:240,delay:140,fill:"backwards"})}
      else if(dur){var dy=first[p.id]-e.getBoundingClientRect().top;if(dy)e.animate([{transform:"translateY("+dy+"px)"},{transform:"none"}],{duration:280,easing:"ease"})}
    });
  },dur&&gone.length?190:0);
}

function boardHtml(p){
  var h='<h2>Who’s doing what</h2><div class="board">';
  ["Me"].concat(team(p),[""]).forEach(function(n){
    var next=[],doing=[],wait=[],todo=[];
    p.tasks.forEach(function(k){if(k.who===n)next.push('<li class="next"><em>Next</em><span class="tt">'+esc(k.t)+'</span><button class="x sm2" data-rmtask="'+k.id+'" aria-label="Remove next step">×</button></li>')});
    p.parts.forEach(function(x){
      var pn=esc(x.medium||"Untitled part");
      x.milestones.forEach(function(m){
        if(m.who!==n||m.st==="done")return;
        (m.st==="doing"?doing:m.st==="waiting"?wait:todo).push('<li class="'+m.st+'"><em>'+SL[m.st]+'</em>'+esc(m.t)+' <small>'+pn+'</small></li>');
      });
    });
    var lines=next.concat(doing,wait,todo);
    if(n===""&&!lines.length)return;
    h+='<div class="who"><b>'+(n===""?"Unassigned":esc(n))+'</b>'+(doing.length?' <span class="tag">'+doing.length+' in progress</span>':'')+'<ul>'+(lines.join("")||'<li class="none">Nothing assigned</li>')+'</ul></div>';
  });
  return h+'</div>';
}

function goBtn(p,txt,sub,extra){return '<button class="it" data-go="'+p.id+'"><span>'+esc(txt)+'</span>'+(extra||'')+'<small>'+esc(p.title||"Untitled")+(sub?' · '+esc(sub):'')+'</small></button>'}
function renderMain(d){

    var names=Object.keys(g).sort(function(a,b){return a==="Me"?-1:b==="Me"?1:a==="Unassigned"?1:b==="Unassigned"?-1:a.toLowerCase()<b.toLowerCase()?-1:1});

      p.parts.forEach(function(x){x.milestones.forEach(function(m){if(m.due&&m.st!=="done")a.push({d:m.due,p:p,t:m.t,s:x.medium})})})});

  }

  $("back").onclick=function(){$("app").classList.remove("open")};
  [].forEach.call(d.querySelectorAll("[data-go]"),function(b){b.onclick=function(){var p=S.projects.find(function(x){return x.id===b.dataset.go});S.sel=p.id;S.shelf=p.shelf;S.main="project";save();render(true)}});
  if(S.main==="backup"){
    $("bkt").value=json;$("bkt").onfocus=function(){this.select()};
    $("bk").onclick=async function(){var m=$("bkm"),f=new File([json],"my-studio-backup-"+ymd(Date.now())+".json",{type:"application/json"});
      try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"My Studio backup"});m.textContent="Backup shared.";return}}
      catch(e){if(e&&e.name==="AbortError")return}
      try{var u=URL.createObjectURL(f),l=document.createElement("a");l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove();m.textContent="If no file arrived, copy the backup text below instead."}

    $("rs").onclick=function(){var m=$("bkm"),o;try{o=JSON.parse($("rst").value)}catch(e){}
      if(!o||!Array.isArray(o.projects)){m.textContent="That doesn’t look like a My Studio backup.";return}

  if(open&&cur())$("app").classList.add("open");
}
function applyMenu(){$("app").classList.toggle("collapsed",!!S.collapsed);var t=$("menuTab");t.textContent=S.collapsed?"›":"‹";t.setAttribute("aria-label",S.collapsed?"Show menu":"Hide menu");t.setAttribute("aria-expanded",String(!S.collapsed))}
try{S.collapsed=localStorage.getItem("my-studio-ui")==="1"}catch(e){}
$("menuTab").onclick=function(){S.collapsed=!S.collapsed;try{localStorage.setItem("my-studio-ui",S.collapsed?"1":"")}catch(e){}applyMenu()};
$("results").onclick=function(e){var b=e.target.closest("[data-open]");if(!b)return;S.sel=b.dataset.open;S.main="project";S.confirm=false;S.confirmPart=null;save();render(true)};
var mo=new MutationObserver(function(){applyDir($("ctl"));applyDir($("detail"))});mo.observe($("ctl"),{childList:true});mo.observe($("detail"),{childList:true});
applyMenu();render();
if(cur()&&window.matchMedia("(max-width:760px)").matches)$("app").classList.add("open");
</script>
